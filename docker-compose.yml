version: '3.8'

services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: snowtricks_php
    volumes:
      - .:/var/www/html
    networks:
      - snowtricks
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: snowtricks_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - snowtricks
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: snowtricks_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: snowtricks_db
      MYSQL_USER: snowtricks_user
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - snowtricks

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: snowtricks_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    networks:
      - snowtricks
    depends_on:
      - mysql

networks:
  snowtricks:
    driver: bridge

volumes:
  mysql_data: